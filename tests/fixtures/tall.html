<!doctype html>
<title>tall page</title>
<style>body { margin: 0; font: 16px sans-serif; } div { height: 100px; border-bottom: 1px solid #ccc; padding: 4px; }</style>
<section id="inner" style="height: 80px; width: 300px; overflow: auto"><p style="height: 400px">a scroll box inside the page</p></section>
<aside id="fixed" style="position: fixed; right: 0; top: 200px; width: 120px; height: 200px; overflow: auto; background: #eef"><p style="height: 1000px">a fixed scroll box at the right edge</p></aside>
<script>
  for (let i = 0; i < 60; i++) document.write(`<div id="row${i}">row ${i}</div>`);
</script>
