<!doctype html>
<html><head><title>termium links</title>
<style>
 body { margin: 0; font: 20px sans-serif; }
 a, div, iframe { display: block; box-sizing: border-box; height: 20vh; width: 100%; border: 0; margin: 0; }
 a { background: #def; border-bottom: 1px solid #9ab; }
</style></head>
<body>
<a id="plain" href="/page.html?from=links">Plain link</a>
<a id="long" onmouseover="setTimeout(() => this.href = '/changed-href', 1500)" href="/a/very/long/path/that/goes/on/and/on/and/on/much/further/than/the/address/row/can/show/at/once/index.html?with=a&amp;query=string&amp;that=is&amp;long=too#and-a-fragment">Long link</a>
<div id="none">Not a link</div>
<iframe id="cross"></iframe>
<iframe id="same" src="/links-frame.html"></iframe>
<!-- Below the fold (End scrolls to them): -->
<iframe id="port"></iframe>
<div id="scaled"><iframe src="/links-two.html" style="height: 40vh; width: 200%; transform: scale(.5); transform-origin: 0 0"></iframe></div>
<a id="vanish" href="/vanish-target" onmouseover="setTimeout(() => this.replaceWith(Object.assign(document.createElement('div'), { textContent: 'gone' })), 800)">Link that goes away</a>
<script>
 // localhost vs 127.0.0.1: another site, so its own process (an out-of-process iframe).
 document.getElementById('cross').src = 'http://localhost:' + location.port + '/links-frame.html';
 // Another port: same site (same process), another origin (out of reach of the page's script).
 const alt = new URLSearchParams(location.search).get('alt');
 if (alt) document.getElementById('port').src = 'http://127.0.0.1:' + alt + '/links-frame.html?port';
</script>
</body></html>
