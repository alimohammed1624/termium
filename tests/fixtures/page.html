<!doctype html>
<html><head><title>termium test page</title>
<style>
 body { font: 16px sans-serif; margin: 20px; }
 #log { white-space: pre; font: 13px monospace; background: #eee; padding: 6px; height: 160px; overflow: auto; }
 button, input, textarea { font-size: 16px; margin: 4px; }
 .tall { height: 2000px; background: linear-gradient(#fff, #9cf); }
</style></head>
<body>
<h1 id="h">Test page</h1>
<input id="inp" placeholder="type here" autocomplete="off">
<textarea id="ta" rows="2"></textarea>
<button id="btn" onclick="clicks++; document.getElementById('cnt').textContent = clicks">Click me</button>
<span id="cnt">0</span>
<button id="al" onclick="alert('hello from page')">Alert</button>
<button id="pr" onclick="document.getElementById('h').textContent = 'prompt: ' + prompt('Your name?', 'anon')">Prompt</button>
<a id="pop" href="/page.html?popup=1" target="_blank">Open in new tab</a>
<a id="popmid" href="/page.html?mid=1" target="_blank">Middle-click me</a>
<button id="cf" onclick="document.getElementById('h').textContent = 'confirm: ' + confirm('Proceed?')">Confirm</button>
<br>
<select id="sel" onchange="document.getElementById('selout').textContent = 'changed:' + this.value">
  <option value="alpha">Alpha</option><option value="beta">Beta</option><option value="gamma">Gamma</option>
</select>
<span id="selout"></span>
<input id="file" type="file" oncancel="cancels++">
<a id="next" href="/page.html?step=2">Next page</a>
<a id="dl" href="/dl.txt" download="dl.txt">Download</a>
<button id="later" onclick="setTimeout(() => alert('delayed alert'), 1500)">Alert later</button>
<input id="guard" placeholder="edit to guard" oninput="window.onbeforeunload = (e) => { e.preventDefault(); return ''; }">
<br>
<iframe id="xf" width="420" height="90" style="border:1px solid #999"></iframe>
<span id="shadowhost"></span>
<select id="hsel"><option>start</option><option hidden>obsolete</option><option>current</option></select>
<input id="afterhsel" size="4">
<button id="longmsg" onclick="alert('First line of a long message.\n' + 'This message is much longer than the address bar can show, so termium shows it in full over the page. '.repeat(3) + '\nLast line: END-OF-MESSAGE')">Long alert</button>
<button id="modal" onclick="document.getElementById('dlg').showModal()">Modal</button>
<dialog id="dlg"><select id="msel"><option>Apple</option><option>Banana</option><option>Cherry</option></select>
<button onclick="document.getElementById('dlg').close()">Close</button></dialog>
<button id="filelater" onclick="setTimeout(() => document.getElementById('file').click(), 1500)">File later</button>
<div id="log"></div>
<div class="tall"></div>
<script>
 var clicks = 0, pastes = 0, moves = 0, ticks = 0, cancels = 0, sselInputs = 0;
 addEventListener('input', (e) => { const t = e.composedPath()[0]; if (t && t.id === 'ssel') sselInputs++; });
 addEventListener('mousemove', () => moves++);
 setInterval(() => ticks++, 100);
 addEventListener('paste', () => pastes++, true);
 window.frameState = null;
 addEventListener('message', (e) => { window.frameState = e.data; });
 // A <select> inside an open shadow root.
 { const root = document.getElementById('shadowhost').attachShadow({ mode: 'open' });
   root.innerHTML = '<select id="ssel"><option>North</option><option>South</option><option>East</option></select>'; }
 // A cross-site iframe: the page is served from 127.0.0.1, the frame from localhost.
 if (location.hostname === '127.0.0.1')
   document.getElementById('xf').src = 'http://localhost:' + location.port + '/frame.html';
 const log = (s) => { const l = document.getElementById('log'); l.textContent += s + "\n"; l.scrollTop = 1e9; };
 addEventListener('keydown', e => log(`down ${e.key} ${e.code} ${e.ctrlKey?'C':''}${e.shiftKey?'S':''}${e.altKey?'A':''}`));
 addEventListener('keyup', e => log(`up ${e.key}`));
 addEventListener('dblclick', e => log(`dblclick`));
 addEventListener('scroll', () => { document.title = 'scrolled ' + Math.round(scrollY); });
 window.termiumState = () => ({ cancels, sselInputs, outer: [outerWidth, outerHeight], inner: [innerWidth, innerHeight], hsel: document.getElementById('hsel').value, active: document.activeElement && document.activeElement.id, moves, ticks, vis: document.visibilityState, msel: document.getElementById('msel').value, ssel: document.getElementById('shadowhost').shadowRoot.getElementById('ssel').value, focused: document.hasFocus(), pastes, frame: window.frameState, sel: document.getElementById('sel').value, selout: document.getElementById('selout').textContent, file: (document.getElementById('file').files[0] || {}).name || "", ua: navigator.userAgent, webdriver: navigator.webdriver, inp: document.getElementById('inp').value, ta: document.getElementById('ta').value, clicks, scrollY, w: innerWidth, h: innerHeight, dpr: devicePixelRatio, log: document.getElementById('log').textContent });
</script>
</body></html>
