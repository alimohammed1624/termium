<!doctype html>
<meta charset="utf-8">
<title>audio</title>
<body style="font: 16px sans-serif">
<h1 id="h">audio</h1>
<p>?mode=media: an &lt;audio&gt; element; ?mode=osc: a Web Audio oscillator; ?mode=frame&amp;src=URL: an iframe that plays (its own ?mode, ?auto=1).</p>
<div id="slot"></div>
<script>
const mode = new URLSearchParams(location.search).get("mode") || "media";
document.getElementById("h").textContent = "audio: " + mode;
// A second of a 440 Hz tone as a WAV blob (no audio file needed).
function tone() {
  const rate = 8000, n = rate, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const s = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  s(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); s(8, "WAVEfmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 440 * i / rate) * 0.5 * 32767, true);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}
let el = null, ctx = null;
window.start = async () => {
  if (mode === "media") {
    el = el || Object.assign(document.createElement("audio"), { src: tone(), loop: true, id: "player" });
    document.getElementById("slot").append(el);
    await el.play();
  } else if (mode === "osc") {
    ctx = ctx || new AudioContext();
    const o = ctx.createOscillator();
    o.connect(ctx.destination);
    o.start();
    await ctx.resume();
  } else {
    const f = document.createElement("iframe");
    f.allow = "autoplay";
    f.src = new URLSearchParams(location.search).get("src");
    document.getElementById("slot").append(f);
  }
  return "started";
};
window.stop = async () => {
  if (el) el.pause();
  if (ctx) await ctx.close(), (ctx = null);
  document.getElementById("slot").textContent = "";
  return "stopped";
};
// What the page sees: still playing (a muted tab isn't paused or suspended, just silent).
window.state = () => ({ mode, paused: el ? el.paused : null, muted: el ? el.muted : null, time: el ? el.currentTime : ctx ? ctx.currentTime : null, ctx: ctx ? ctx.state : null });
if (new URLSearchParams(location.search).get("auto")) start().catch((e) => (document.title = "autoplay failed: " + e));
</script>
</body>
