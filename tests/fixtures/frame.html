<!doctype html>
<html><head><title>frame</title><style>body { font: 14px sans-serif; margin: 6px; }</style></head>
<body>
<select id="fsel" onchange="report()"><option value="one">One</option><option value="two">Two</option><option value="three">Three</option></select>
<input id="ffile" type="file" onchange="report()">
<script>
 // Reports to the parent page (tests read it there), with element positions
 // inside the frame so the test can click them.
 function rect(id) { const r = document.getElementById(id).getBoundingClientRect(); return [r.x + Math.min(r.width / 2, 30), r.y + r.height / 2]; }
 function report() {
   parent.postMessage({ ua: navigator.userAgent, brands: navigator.userAgentData ? navigator.userAgentData.brands.map(b => b.brand).join(',') : '',
     sel: document.getElementById('fsel').value, file: (document.getElementById('ffile').files[0] || {}).name || '',
     selRect: rect('fsel'), fileRect: rect('ffile') }, '*');
 }
 report();
</script>
</body></html>
