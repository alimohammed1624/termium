<!doctype html><title>Pick fixture</title>
<style>body { margin: 0; font: 20px sans-serif } .box { position: absolute; left: 60px; width: 400px; height: 90px }</style>
<button id=big class=box style="top: 40px" onclick="window.clicks = (window.clicks || 0) + 1">Big button</button>

<p class=box style="top: 300px" onclick="window.pclicks = 1">Some <b>bold</b> words</p>
