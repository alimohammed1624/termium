<!doctype html><title>Agent fixture</title>
<h1>Agent fixture</h1>
<form id=f onsubmit="event.preventDefault(); document.getElementById('out').textContent = 'Hello, ' + document.getElementById('name').value + ' (' + document.getElementById('color').value + ')';">
<label for=name>Name</label> <input id=name placeholder="Your name">
<label for=color>Colour</label> <select id=color><option value=r>Red</option><option value=g>Green</option></select>
<label><input type=checkbox id=agree> Agree</label>
<label for=off>Locked</label> <input id=off disabled>
<label for=pw>Secret</label> <input id=pw type=password>
<label for=city>City</label> <input id=city>
<label for=offsel>Frozen list</label> <select id=offsel disabled><option value=a>Apple</option><option value=b>Banana</option></select>
<button id=go type=submit>Greet</button>
</form>
<p id=out>nobody yet</p>
<p id=notes-label>Notes</p><div id=ed contenteditable role=textbox aria-labelledby=notes-label style="min-height:2em;border:1px solid"></div>
<div id=host></div>
<script>document.getElementById('host').attachShadow({mode: 'open'}).innerHTML = '<label>Shadow field <input id=sin></label>';</script>
<button id=later onclick="setTimeout(()=>{const d=document.createElement('div');d.id='late';d.textContent='Arrived late';document.body.append(d)},800)">Load later</button>
