<!doctype html><title>Agent fixture</title>
<h1>Agent fixture</h1>
<form id=f onsubmit="event.preventDefault(); document.getElementById('out').textContent = 'Hello, ' + document.getElementById('name').value + ' (' + document.getElementById('color').value + ')';">
<label for=name>Name</label> <input id=name placeholder="Your name">
<label for=color>Colour</label> <select id=color><option value=r>Red</option><option value=g>Green</option></select>
<label><input type=checkbox id=agree> Agree</label>
<label for=off>Locked</label> <input id=off disabled>
<label for=pw>Secret</label> <input id=pw type=password>
<label for=city>City</label> <input id=city>
<label for=offsel>Frozen list</label> <select id=offsel disabled><option value=a>Apple</option><option value=b>Banana</option></select>
<input id=jumpy aria-label="Jumpy later" onfocus="queueMicrotask(() => document.getElementById('city').focus())">
<input id=jumpnow aria-label="Jumpy now" onfocus="document.getElementById('city').focus()">
<button id=go type=submit>Greet</button>
</form>
<p id=out>nobody yet</p>
<form id=f2 onsubmit="event.preventDefault(); window.f2sub = document.getElementById('short').value"><input id=short maxlength=4 aria-label="Short field"></form>
<form id=f3 onsubmit="event.preventDefault(); window.f3sub = 1"><input id=mover aria-label="Mover field" oninput="queueMicrotask(() => document.getElementById('other').focus())"></form>
<form id=f4 onsubmit="event.preventDefault(); window.f4sub = 1"><input id=other aria-label="Other field"></form>
<button id=alerter onclick="alert('clicked')">Alert me</button>
<form id=f5 onsubmit="event.preventDefault(); window.f5sub = document.getElementById('pick').value"><select id=pick aria-label="Pick one"><option value=a>Ay</option><option value=b>Bee</option></select></form>
<form id=f6 onsubmit="event.preventDefault(); alert('check it')"><input id=validated aria-label="Validated field"></form>
<select id=grp aria-label="Grouped list"><option value=a>Alpha</option><optgroup disabled label="Off"><option value=z>Zed</option></optgroup></select>
<button id=slowmove onmousemove="const e = Date.now() + 1500; while (Date.now() < e);" onclick="window.slowClicked = 1">Slow to hover</button>
<div style="position:relative;display:inline-block"><iframe id=fr srcdoc="<button onclick='parent.frameBtn = 1'>Covered frame button</button>" style="width:220px;height:50px"></iframe><div id=frcover onclick="window.frameCover = 1" style="position:absolute;inset:0"></div></div>
<iframe id=fr2 srcdoc="<button onclick='parent.frameBtn2 = 1'>Open frame button</button>" style="width:220px;height:50px"></iframe>
<div style="position:relative;display:inline-block"><button id=under onclick="window.underClicked = 1">Under button</button><div id=cover onclick="window.coverClicked = 1" style="position:absolute;inset:0;background:rgba(0,0,0,0.1)"></div></div>
<p id=notes-label>Notes</p><div id=ed contenteditable role=textbox aria-labelledby=notes-label style="min-height:2em;border:1px solid"></div>
<div id=host></div>
<script>document.getElementById('host').attachShadow({mode: 'open'}).innerHTML = '<label>Shadow field <input id=sin></label>';</script>
<button id=later onclick="setTimeout(()=>{const d=document.createElement('div');d.id='late';d.textContent='Arrived late';document.body.append(d)},800)">Load later</button>
<a href="#bottom">Down</a>
<div style="height:3000px"></div><p id=bottom>Bottom</p>
<h2 id=termium-heading>A heading whose id starts with termium-</h2>
