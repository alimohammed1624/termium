<!doctype html>
<html><head><title>menu test</title></head>
<body style="margin:0; font:16px sans-serif">
<a id="link" href="/page.html?step=2" style="position:absolute; left:20px; top:20px">a link</a>
<div id="own" style="position:absolute; left:20px; top:80px; width:200px; height:80px; background:#ddd"
     oncontextmenu="event.preventDefault(); window.own = (window.own || 0) + 1">has its own menu</div>
<button id="ask" style="position:absolute; left:20px; top:200px" onclick="window.answer = confirm('Really?')">ask</button>
<script>window.answer = null; window.own = 0;</script>
</body></html>
